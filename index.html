<html>
 <head>  
 </head> 
 <body> 
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>Einrücken Countdown</title> 
  <link rel="stylesheet" href="style.css"> 
  <div class="clock-container"> 
   <h1>Abrücke – Kaserne Frauenfeld</h1> 
   <div class="flip-clock"> 
    <div class="flip-unit"> 
     <div class="card" id="days">
       00 
     </div> 
     <div class="label">
       Tage 
     </div> 
    </div> 
    <div class="flip-unit"> 
     <div class="card" id="hours">
       00 
     </div> 
     <div class="label">
       Std 
     </div> 
    </div> 
    <div class="flip-unit"> 
     <div class="card" id="mins">
       00 
     </div> 
     <div class="label">
       Min 
     </div> 
    </div> 
    <div class="flip-unit"> 
     <div class="card" id="secs">
       00 
     </div> 
     <div class="label">
       Sek 
     </div> 
    </div> 
   </div> 
  </div> 
  <script>
    const target = new Date("2026-04-23T08:00:00").getTime();

    function flip(element, newValue) {
      const card = document.getElementById(element);
      const oldValue = card.textContent;
      if (oldValue === newValue) return;

      card.classList.add("flip");
      setTimeout(() => {
        card.textContent = newValue;
        card.classList.remove("flip");
      }, 300);
    }

    function update() {
      const now = Date.now();
      const diff = target - now;

      if (diff <= 0) {
        flip("days", "0");
        flip("hours", "00");
        flip("mins", "00");
        flip("secs", "00");
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const mins = Math.floor((diff / (1000 * 60)) % 60);
      const secs = Math.floor((diff / 1000) % 60);

      flip("days", days.toString());
      flip("hours", hours.toString().padStart(2, "0"));
      flip("mins", mins.toString().padStart(2, "0"));
      flip("secs", secs.toString().padStart(2, "0"));
    }

    setInterval(update, 1000);
    update();
  </script>   
 </body>
</html>
